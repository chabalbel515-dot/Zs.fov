<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle C++</title>
    <style>
        :root { --primary: #00f2ff; --bg: #0f172a; }
        body { margin: 0; height: 100vh; background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; color: white; }
        
        /* Design do Painel */
        .panel {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            text-align: center;
            width: 280px;
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; }

        /* Status do Sistema */
        .status-container { margin: 20px 0; padding: 10px; border-radius: 10px; background: #0f172a; }
        #status-text { font-weight: bold; transition: 0.3s; }
        .off { color: #f43f5e; }
        .on { color: #10b981; text-shadow: 0 0 10px #10b981; }

        /* Botão de Ativação (Switch) */
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(26px); }

        .desc { font-size: 0.8rem; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Sistema Magnético</h2>
        
        <div class="status-container">
            Status: <span id="status-text" class="off">DESATIVADO</span>
        </div>

        <label class="switch">
            <input type="checkbox" id="toggle-btn">
            <span class="slider"></span>
        </label>

        <p class="desc">Zs.xisFF</p>
    </div>

    <script>
        // Binário do C++ que gerencia o estado (0 ou 1)
        const wasmCode = new Uint8Array([
            0,97,115,109,1,0,0,0,1,133,128,128,128,0,1,96,1,127,1,127,3,130,128,128,128,0,1,0,7,139,128,128,128,0,1,7,111,110,95,111,102,102,0,0,10,143,128,128,128,0,1,137,128,128,128,0,0,32,0,65,1,111,11
        ]);

        const statusText = document.getElementById('status-text');
        const toggleBtn = document.getElementById('toggle-btn');

        WebAssembly.instantiate(wasmCode).then(results => {
            // Função do C++ que inverte o sinal
            const processarEstado = results.instance.exports.on_off;

            toggleBtn.addEventListener('change', () => {
                const valorAtual = toggleBtn.checked ? 1 : 0;
                
                // O C++ recebe o valor e valida a operação
                const resultado = processarEstado(valorAtual);

                if (resultado === 1) {
                    statusText.innerText = "ATIVADO";
                    statusText.className = "on";
                    document.body.style.boxShadow = "inset 0 0 100px rgba(16,185,129,0.2)";
                } else {
                    statusText.innerText = "DESATIVADO";
                    statusText.className = "off";
                    document.body.style.boxShadow = "none";
                }
            });
        });
    </script>
</body>
</html>
