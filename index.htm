<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL SIELZADA V3</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --orange: #ff8c00; --bg: #050505; --card: rgba(20, 20, 20, 0.8); }
        
        body {
            margin: 0; background-color: var(--bg); color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #1a1000 0%, #050505 100%);
        }

        .container {
            width: 90%; max-width: 380px;
            background: var(--card); border: 1px solid rgba(255, 140, 0, 0.2);
            border-radius: 25px; padding: 25px;
            backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 { font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 25px; color: #eee; }

        .option-row {
            background: rgba(0, 0, 0, 0.4); border-radius: 15px;
            padding: 12px 15px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .info { display: flex; align-items: center; text-align: left; }
        .icon { 
            width: 40px; height: 40px; background: var(--orange); 
            border-radius: 10px; margin-right: 15px;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: black;
        }

        .text b { display: block; font-size: 0.9rem; }
        .text span { font-size: 0.7rem; color: #888; }

        /* Switch Style */
        .switch {
            position: relative; display: inline-block; width: 40px; height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px;
        }
        input:checked + .slider { background-color: var(--orange); }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider:before { transform: translateX(18px); }

        .btn-main {
            width: 100%; padding: 15px; background: var(--orange);
            border: none; border-radius: 15px; color: black;
            font-weight: bold; text-transform: uppercase; margin-top: 20px;
            cursor: pointer; transition: 0.3s;
        }
        .btn-main:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <h2>PAINEL SIELZADA V3</h2>

        <div class="option-row">
            <div class="info">
                <div class="icon">◎</div>
                <div class="text"><b>aimbot legit</b><span>Melhora o alinhamento da mira.</span></div>
            </div>
            <label class="switch"><input type="checkbox" id="aimbot"><span class="slider"></span></label>
        </div>

        <div class="option-row">
            <div class="info">
                <div class="icon">⚙</div>
                <div class="text"><b>reduzir lags</b><span>Remove os lags do jogo.</span></div>
            </div>
            <label class="switch"><input type="checkbox" id="lags"><span class="slider"></span></label>
        </div>

        <div class="option-row">
            <div class="info">
                <div class="icon">📱</div>
                <div class="text"><b>melhorar 2x</b><span>Melhora sua mira 2x em até 10%.</span></div>
            </div>
            <label class="switch"><input type="checkbox" id="improve2x"><span class="slider"></span></label>
        </div>

        <div class="option-row">
            <div class="info">
                <div class="icon">🚀</div>
                <div class="text"><b>aumentar desempenho</b><span>Otimização máxima de FPS.</span></div>
            </div>
            <label class="switch"><input type="checkbox" id="fps"><span class="slider"></span></label>
        </div>

        <button class="btn-main" onclick="openGame()">ABRIR FREE FIRE</button>
    </div>

    <script type="module" src="enginebundle.js"></script>
</body>
</html>
